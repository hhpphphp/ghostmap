<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이면기담 裏面奇談 | 한국과 일본의 괴담 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --panel:#0c0c0c;
  --panel2:#151515;
  --line:#242424;
  --text:#ece6e4;
  --dim:#8f8785;
  --blood:#c1121f;
  --blood-hi:#ff3b47;
  --blood-lo:#5a0209;
  --serif:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--blood-hi);outline-offset:2px}

/* ---------- map ---------- */
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:#000}
#map.grabbing{cursor:grabbing}
#map.pointer{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:
   radial-gradient(ellipse at 50% -12%,rgba(130,0,12,.28),transparent 55%),
   radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(0,0,0,.82) 100%)}
.brand{position:fixed;z-index:5;left:18px;top:calc(env(safe-area-inset-top,0px) + 16px);pointer-events:none;transition:opacity .3s}
.brand.hide{opacity:0}
.brand b{display:block;font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:.08em;color:#e8dcd9;text-shadow:0 0 18px rgba(200,10,20,.55)}
.brand span{font-size:12px;color:var(--dim);letter-spacing:.2em}
.hint{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);
  font-size:12.5px;color:var(--dim);background:rgba(0,0,0,.6);padding:7px 14px;border-radius:99px;border:1px solid #1d1d1d;pointer-events:none;transition:opacity .8s;white-space:nowrap}
.hint.gone{opacity:0}
.tip{position:fixed;z-index:6;pointer-events:none;max-width:240px;background:rgba(10,0,0,.92);border:1px solid #4a0d12;color:#f1dcd9;font-size:13px;padding:7px 11px;border-radius:8px;opacity:0;transform:translate(-50%,-100%);transition:opacity .12s}
.tip.on{opacity:1}

/* ---------- nav ---------- */
#nav{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);
  width:calc(100% - 24px);max-width:520px;display:flex;background:rgba(8,8,8,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid #2a1113;border-radius:16px;padding:5px;box-shadow:0 8px 40px rgba(0,0,0,.8),0 0 30px rgba(160,0,14,.12)}
#nav button{flex:1;padding:11px 4px;font-size:13px;color:var(--dim);border-radius:11px;white-space:nowrap;transition:color .2s,background .2s}
#nav button:hover{color:var(--text)}
#nav button.on{color:#fff;background:linear-gradient(180deg,#4a0910,#2a0509);box-shadow:inset 0 0 0 1px #6b1019}
#nav button.write{color:#ff7c85}
#nav button.write.on{color:#fff}

/* ---------- pages ---------- */
.page{position:fixed;inset:0;z-index:20;background:rgba(4,4,4,.97);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 110px);
  opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .28s,transform .28s,visibility .28s}
.page.on{opacity:1;visibility:visible;transform:none}
.wrap{max-width:720px;margin:0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.ph h1{font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:.02em}
.sub{font-size:13.5px;color:var(--dim);margin-bottom:18px;line-height:1.55}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--blood-hi);box-shadow:0 0 10px var(--blood-hi);animation:beat 1.6s infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.cnt{font-size:13px;color:var(--dim)}

.item{display:flex;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.item:hover{background:rgba(120,0,10,.08)}
.rank{flex:0 0 30px;font-family:var(--serif);font-weight:900;font-size:24px;color:#4b4443;line-height:1.1;text-align:center;padding-top:2px}
.rank.top{color:var(--blood-hi);text-shadow:0 0 14px rgba(255,40,50,.5)}
.ib{flex:1;min-width:0}
.it{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:12px}
.tag{padding:2px 8px;border-radius:99px;background:#2a0a0d;color:#ff8d95;border:1px solid #4a141a}
.rg{color:var(--dim)}
.item h3{font-size:16px;font-weight:700;line-height:1.4}
.item p{font-size:13.5px;color:#b3aba9;line-height:1.55;margin:4px 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--dim);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .c-like{color:#ee3945}
.meta .c-cmt{color:#5aa0e0}
.empty{padding:60px 10px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 14px;font-size:13px;color:var(--dim);border-radius:8px}
.seg button.on{background:#3a0a10;color:#fff}
select,input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.filters select{width:auto;flex:1;min-width:120px;padding:9px 10px;font-size:14px}
#allQ{margin-bottom:6px}
input::placeholder,textarea::placeholder{color:#645d5b}

/* write */
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border-radius:99px;font-size:13px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.chips button.on{background:#3a0a10;border-color:#7a1720;color:#fff}
textarea{min-height:200px;resize:vertical;line-height:1.65}
.counter{text-align:right;font-size:12px;color:var(--dim);margin-top:5px}
.submit{width:100%;padding:15px;border-radius:12px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(180deg,#b3101c,#6d040d);box-shadow:0 0 30px rgba(190,10,25,.3);transition:filter .2s}
.submit:hover{filter:brightness(1.15)}
.err{color:#ff7c85;font-size:13px;margin-bottom:12px;min-height:18px}

/* modal + sheet */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.modal.on{opacity:1;visibility:visible}
.card{width:100%;max-width:640px;max-height:92%;background:#0d0d0d;border:1px solid #2b1215;border-radius:18px 18px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .3s;box-shadow:0 -10px 60px rgba(140,0,12,.2)}
.modal.on .card{transform:none}
@media(min-width:700px){.modal{align-items:center}.card{border-radius:18px;max-height:86%}}
.chead{display:flex;justify-content:flex-end;padding:8px 8px 0}
.x{width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--dim)}
.x:hover{background:var(--panel2);color:#fff}
.cbody{overflow-y:auto;padding:0 20px 14px;flex:1}
.cbody h2{font-family:var(--serif);font-weight:900;font-size:23px;line-height:1.35;margin:8px 0 8px}
.by{font-size:12.5px;color:var(--dim);margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap}
.txt{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15.5px;line-height:1.85;color:#e2dad8}
.acts{display:flex;gap:10px;margin:20px 0 22px}
.acts button{flex:1;padding:12px;border-radius:12px;font-size:14px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;gap:7px}
.acts button.like.on{background:#3a0a10;border-color:#8a1a24;color:#ff8d95}
.cbody h4{font-size:14px;margin-bottom:6px}
.cm{padding:11px 0;border-top:1px solid #1b1b1b;font-size:14px;line-height:1.6}
.cm b{font-size:12.5px;color:#c9c0be;margin-right:8px}
.cm b.me{color:#ff8d95}
.cm time{font-size:11.5px;color:var(--dim)}
.cin{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cin input{flex:1}
.cin button{padding:0 18px;border-radius:10px;background:#5a0a12;font-weight:700;font-size:14px}
.sheet-list .item{padding:14px 2px}
.sheet-title{font-family:var(--serif);font-weight:900;font-size:19px;margin:6px 0 4px}
.toast{position:fixed;z-index:90;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-30px);background:#1c0509;border:1px solid #6b1019;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.35s;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}

[hidden]{display:none!important}
.appbtn{position:fixed;z-index:44;right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;transition:opacity .3s,transform .3s}
.appbtn.hide{opacity:0;pointer-events:none;transform:translateY(-6px)}
.appico{position:relative;display:block;width:54px;height:54px;border-radius:50%;box-shadow:0 6px 22px rgba(0,0,0,.75),0 0 28px rgba(190,10,25,.38);transition:transform .2s}
.appico svg{display:block;width:100%;height:100%}
.appico::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,60,70,.55);animation:ring 2.6s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.appbtn:hover .appico{transform:scale(1.07)}
.applbl{font-size:11px;color:#dccfcb;text-shadow:0 1px 6px #000,0 0 10px #000;text-align:center;line-height:1.3;word-break:keep-all}
.appcard{max-width:560px;height:94%;max-height:94%;overflow:hidden}
.apphead{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 18px;border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:900;font-size:16px}
#appFrame{flex:1;width:100%;border:0;background:#000}
@media(max-width:699px){#appModal .appcard{height:100%;max-height:100%;max-width:none;border-radius:0;border:0}#appModal .apphead{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}}

.note{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.55}
.cin #cPw{flex:0 0 92px;width:92px;font-size:14px;padding:10px 8px}
.delrow{display:flex;gap:8px;margin:-8px 0 18px}
.delrow input{flex:1;min-width:0}
.delrow button{padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.delrow button.go{background:#6b0f19;border-color:#6b0f19;color:#fff}
.cm .delrow{margin:8px 0 0}
.trbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 14px}
.trbar .tr{padding:8px 14px;border-radius:10px;font-size:13px;border:1px solid var(--line);background:var(--panel2)}
.trnote{font-size:12px;color:var(--dim);margin:0 0 12px}
.trbar .trnote{margin:0}
.brand{pointer-events:auto;user-select:none;-webkit-user-select:none}
.brand.hide{pointer-events:none}
.ph{padding-right:96px}
.langbtn{position:fixed;z-index:45;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:rgba(8,8,8,.88);border:1px solid #3a1519;font-size:13px;color:#e8dcd9;box-shadow:0 4px 20px rgba(0,0,0,.6)}
.langbtn:hover{border-color:#7a1720;color:#fff}
.langbtn svg{flex:none}
.adminTag{font-family:inherit;cursor:pointer;position:fixed;z-index:45;left:18px;top:calc(env(safe-area-inset-top,0px) + 64px);font-size:12px;color:#ff8d95;background:#2a0a0d;border:1px solid #6b1019;padding:4px 10px;border-radius:99px}
.adminBtn{margin:0 0 10px;padding:9px 14px;border-radius:10px;font-size:13px;color:#ff8d95;border:1px solid #6b1019;background:#2a0a0d}
.adminBtn.arm{background:#6b0f19;color:#fff}
.acts button.danger{color:#ff8d95;border-color:#4a141a;flex:none;padding:12px 16px}
.acts button.danger.arm{background:#6b0f19;color:#fff}
.acts button.tr{flex:none;padding:12px 16px}
.cmh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmdel{font-size:12px;color:var(--dim);padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
.cmdel:hover,.cmdel.arm{color:#fff;background:#6b0f19;border-color:#6b0f19}
.ico{font-size:12px;letter-spacing:-.05em}
</style>
</head>
<body>

<canvas id="map" aria-label="이면기담 裏面奇談 지도"></canvas>
<div class="vignette"></div>
<div class="brand" id="brand"><b>裏面奇談</b><span data-i18n="brandSub"></span></div>
<button class="langbtn" id="langBtn" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="langLbl"></span></button>
<button class="adminTag" id="adminTag" type="button" hidden></button>
<button class="appbtn" id="appBtn" type="button"><span class="appico"><svg viewBox="0 0 52 52" aria-hidden="true"><defs><radialGradient id="aiBg" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#3b0a12"/><stop offset="1" stop-color="#050001"/></radialGradient><radialGradient id="aiDrop" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ff5a64"/><stop offset=".55" stop-color="#c1121f"/><stop offset="1" stop-color="#58020b"/></radialGradient></defs><circle cx="26" cy="26" r="24.5" fill="url(#aiBg)" stroke="#7a1720" stroke-width="1.5"/><path d="M7 27c5.5-8.5 12-12.5 19-12.5S39.5 18.5 45 27c-5.5 8.5-12 12.5-19 12.5S12.5 35.5 7 27z" fill="#0a0203" stroke="#e8dcd9" stroke-width="1.6" stroke-linejoin="round"/><path d="M26 17.5c2.9 3.9 5.6 6.6 5.6 9.8a5.6 5.6 0 0 1-11.2 0c0-3.2 2.7-5.9 5.6-9.8z" fill="url(#aiDrop)"/><ellipse cx="23.6" cy="26.2" rx="1.2" ry="2" transform="rotate(20 23.6 26.2)" fill="#fff" opacity=".55"/><path d="M26 7.5v3.2M15.5 10.5l1.6 2.7M36.5 10.5l-1.6 2.7" stroke="#a31b27" stroke-width="1.6" stroke-linecap="round"/><path d="M13 42.5c4 1.6 8.5 2.4 13 2.4s9-.8 13-2.4" stroke="#7a1720" stroke-width="1.2" stroke-linecap="round" opacity=".7" fill="none"/></svg></span><span class="applbl" data-i18n="appName"></span></button>
<div class="hint" id="hint" data-i18n="hint"></div>
<div class="tip" id="tip"></div>

<nav id="nav">
  <button data-view="map" class="on" data-i18n="navMap"></button>
  <button data-view="hot" data-i18n="navHot"></button>
  <button data-view="all" data-i18n="navAll"></button>
  <button data-view="write" class="write" data-i18n="navWrite"></button>
</nav>

<section class="page" id="page-hot"><div class="wrap">
  <div class="ph"><h1 data-i18n="hotTitle"></h1><div class="live"><i></i><span id="hotClock"></span></div></div>
  <p class="sub" data-i18n="hotSub"></p>
  <div id="hotList"></div>
</div></section>

<section class="page" id="page-all"><div class="wrap">
  <div class="ph"><h1 data-i18n="allTitle"></h1><span class="cnt" id="allCount"></span></div>
  <div class="filters">
    <div class="seg" id="allCountry"><button data-v="ALL" class="on" data-i18n="fAll"></button><button data-v="KR" data-i18n="kr"></button><button data-v="JP" data-i18n="jp"></button></div>
    <select id="allRegion"></select>
    <select id="allSort"><option value="new" data-i18n="sortNew"></option><option value="like" data-i18n="sortLike"></option><option value="view" data-i18n="sortView"></option><option value="cmt" data-i18n="sortCmt"></option></select>
  </div>
  <div class="chips" id="allCats" style="margin:0 0 10px"></div>
  <input type="text" id="allQ" data-ph="searchPh" autocomplete="off">
  <div id="allList"></div>
</div></section>

<section class="page" id="page-write"><div class="wrap">
  <div class="ph"><h1 data-i18n="writeTitle"></h1></div>
  <p class="sub" data-i18n="writeSub"></p>
  <div class="field"><label data-i18n="fCountry"></label><div class="seg" id="wCountry"><button data-v="KR" class="on" data-i18n="kr"></button><button data-v="JP" data-i18n="jp"></button></div></div>
  <div class="field"><label for="wRegion" data-i18n="fRegion"></label><select id="wRegion"></select></div>
  <div class="field"><label data-i18n="fCat"></label><div class="chips" id="wCats"></div></div>
  <div class="field"><label for="wTitle" data-i18n="fTitle"></label><input type="text" id="wTitle" maxlength="60" data-ph="phTitle" autocomplete="off"></div>
  <div class="field"><label for="wBody" data-i18n="fBody"></label><textarea id="wBody" maxlength="3000" data-ph="phBody"></textarea><div class="counter"><span id="wCount">0</span> / 3000</div></div>
  <div class="field"><label for="wNick" data-i18n="fNick"></label><input type="text" id="wNick" maxlength="12" data-ph="phNick" autocomplete="off"></div>
  <div class="field"><label for="wPw" data-i18n="fPw"></label><input type="password" id="wPw" maxlength="20" data-ph="phPw" autocomplete="new-password"><div class="note" data-i18n="pwNote"></div></div>
  <div class="err" id="wErr"></div>
  <button class="submit" id="wSubmit" data-i18n="submit"></button>
</div></section>

<div class="modal" id="detail"><div class="card" role="dialog" aria-modal="true"><div class="chead"><button class="x" data-close aria-label="close">✕</button></div><div class="cbody" id="dBody"></div><div class="cin"><input type="password" id="cPw" maxlength="20" data-ph="cPwPh" autocomplete="new-password"><input type="text" id="cInput" maxlength="200" data-ph="cmtPh" autocomplete="off"><button id="cSend" data-i18n="cmtSend"></button></div></div></div>

<div class="modal" id="sheet"><div class="card" role="dialog" aria-modal="true"><div class="chead"><button class="x" data-close aria-label="close">✕</button></div><div class="cbody sheet-list" id="sBody"></div></div></div>

<div class="modal" id="login"><div class="card" role="dialog" aria-modal="true" style="max-width:400px"><div class="chead"><button class="x" data-close aria-label="close">✕</button></div><div class="cbody" style="padding-bottom:24px"><h2 data-i18n="loginTitle"></h2><div class="field" style="margin-top:16px"><label for="lgEmail" data-i18n="email"></label><input type="text" id="lgEmail" autocomplete="username"></div><div class="field"><label for="lgPw" data-i18n="fPwShort"></label><input type="password" id="lgPw" autocomplete="current-password"></div><div class="err" id="lgErr"></div><button class="submit" id="lgGo" data-i18n="loginBtn"></button></div></div></div>

<div class="modal" id="appModal"><div class="card appcard" role="dialog" aria-modal="true"><div class="apphead"><span data-i18n="appName"></span><button class="x" data-close aria-label="close">✕</button></div><iframe id="appFrame" title="app" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe></div></div>

<div class="toast" id="toast"></div>

</body>
</html>
